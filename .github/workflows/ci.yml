name: Carpool CI

on:
  push:
    branches:
      - main
      - dinitha
      - "feature/**"

  pull_request:
    branches:
      - main
      - dinitha

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CLIENT_ORIGINS: http://localhost:3000,http://localhost:5000

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Prepare SQLite database directory
        run: mkdir -p data

      - name: Initialize SQLite database
        run: node init-db.js

      - name: Seed SQLite test data
        run: node src/seed.js

      - name: Run backend tests with coverage
        run: npm run test:coverage

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t icbt-carpool:ci .

      - name: Verify Docker image exists
        run: docker image inspect icbt-carpool:ci