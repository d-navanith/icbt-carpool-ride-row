services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: icbt-carpool-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000

    volumes:
      - carpool_data:/app/backend/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  carpool_data: