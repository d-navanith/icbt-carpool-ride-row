version: '3.8'

services:
  carpool-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icbt-uniride-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5000}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - SECURITY_HOTLINE=${SECURITY_HOTLINE:-+94 11 584 8888}
    volumes:
      - app-data:/app/backend
    restart: unless-stopped

volumes:
  app-data:
