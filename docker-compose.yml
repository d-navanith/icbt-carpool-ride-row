services:
  carpool-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: icbt-uniride-app

    ports:
      - "5000:5000"
    
    env_file:
      - ./backend/.env

    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: production

    volumes:
      - app-data:/app/backend/data

    restart: unless-stopped

volumes:
  app-data: